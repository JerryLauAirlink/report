<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a2332">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Airlink">
  <title>Airlink</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg:#0f1419; --surface:#1a2332; --border:#2d3a4f;
      --text:#e8edf4; --muted:#8b9cb3; --accent:#2563eb;
      --footer-h:44px; --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.5;padding-bottom:calc(var(--footer-h) + var(--safe-bottom) + 16px)}
    .app-header{background:linear-gradient(180deg,var(--surface),var(--bg));border-bottom:1px solid var(--border);padding:22px 16px 16px;text-align:center}
    .app-header img{height:36px;width:auto;display:block;margin:0 auto 10px}
    .app-header h1{font-size:1.15rem;font-weight:600}
    .app-header p{font-size:.8rem;color:var(--muted);margin-top:4px}
    main{max-width:520px;margin:0 auto;padding:16px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
    .card-title{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
    .choices{display:grid;gap:10px}
    .choice{display:block;width:100%;padding:16px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:#fff;text-align:left;text-decoration:none;cursor:pointer;font-size:1rem}
    .choice strong{display:block;font-size:1.02rem}
    .choice span{display:block;margin-top:3px;color:var(--muted);font-size:.8rem}
    .choice:active{border-color:var(--accent)}
    .back{display:inline-block;margin-bottom:12px;color:#93c5fd;text-decoration:none;font-size:.88rem;background:none;border:0;cursor:pointer;padding:0}
    .picked{font-size:.9rem;margin-bottom:12px}
    .app-footer{position:fixed;bottom:0;left:0;right:0;height:calc(var(--footer-h)+var(--safe-bottom));padding-bottom:var(--safe-bottom);background:#e5e7eb;color:#6b7280;font-size:.68rem;display:flex;align-items:center;justify-content:center;border-top:1px solid #d1d5db}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <header class="app-header">
    <img src="airlink-logo.png" alt="AIRLINK">
    <h1>Airlink</h1>
    <p id="stepText">請先選擇地區</p>
  </header>
  <main>
    <section class="card" id="stepRegion">
      <h2 class="card-title">地區 Office</h2>
      <div class="choices">
        <button type="button" class="choice" data-region="hk"><strong>香港 Hong Kong</strong><span>HK</span></button>
        <button type="button" class="choice" data-region="tw"><strong>台灣 Taiwan</strong><span>TW</span></button>
        <button type="button" class="choice" data-region="sg"><strong>新加坡 Singapore</strong><span>SPORE</span></button>
    </div>
    </section>
    <section class="card" id="stepDoc" hidden>
      <button type="button" class="back" id="backBtn">← 返回選擇地區</button>
      <p class="picked" id="pickedLabel"></p>
      <h2 class="card-title">選擇表單</h2>
      <div class="choices">
        <a class="choice" id="linkReport" href="report.html"><strong>Service Report</strong><span>服務報告 · 填寫後請客戶簽名</span></a>
        <a class="choice" id="linkCert" href="certificate.html"><strong>Cert of Job Completion</strong><span>竣工證明 · 填寫後請客戶簽名</span></a>
      </div>
    </section>
  </main>
  <footer class="app-footer">Powered by Airlink Security Technologies | service@airlink-asia.com</footer>
  <script>
    const REGIONS = {
      hk: '香港 Hong Kong',
      tw: '台灣 Taiwan',
      sg: '新加坡 Singapore'
    };
    const params = new URLSearchParams(location.search);
    let region = params.get('region');
    if (!REGIONS[region]) region = '';

    const stepRegion = document.getElementById('stepRegion');
    const stepDoc = document.getElementById('stepDoc');
    const stepText = document.getElementById('stepText');

    function showDocs(next) {
      region = next;
      history.replaceState(null, '', './?region=' + next);
      stepRegion.hidden = true;
      stepDoc.hidden = false;
      stepText.textContent = '請選擇表單';
      document.getElementById('pickedLabel').textContent = REGIONS[next];
      document.getElementById('linkReport').href = 'report.html?region=' + next;
      document.getElementById('linkCert').href = 'certificate.html?region=' + next;
    }

    document.querySelectorAll('[data-region]').forEach((btn) => {
      btn.addEventListener('click', () => showDocs(btn.dataset.region));
    });
    document.getElementById('backBtn').addEventListener('click', () => {
      region = '';
      history.replaceState(null, '', './');
      stepDoc.hidden = true;
      stepRegion.hidden = false;
      stepText.textContent = '請先選擇地區';
    });
    if (region) showDocs(region);
  </script>
</body>
</html>
